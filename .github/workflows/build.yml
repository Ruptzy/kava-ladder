name: Build the ladder

# The phone saves each night it submits as build/nights/<date>.json. This
# builds the site and the phone tool from it with the same script the desktop
# uses, so there is only one way the site is ever built.
on:
  push:
    branches: [main]
    # a night from the phone, or any change to the builders, data or template
    paths: ['build/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# two nights submitted close together build one after the other, never at once
concurrency:
  group: ladder-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York   # "updated" dates are the club's, not UTC's
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # the night file is a hand-off: its games go into history.json, anyone
      # added on the phone joins roster.json and seeds.json, and the file goes
      - name: Fold the night into the club records
        run: python build/promote_nights.py

      - name: Build the site and the phone tool
        working-directory: build
        run: |
          python buildsite.py
          python buildpairings.py

      # a broken build fails here, before anything is pushed; the phone's Submit
      # then reports a failed build instead of Discord linking to a broken page
      - name: Refuse to publish a broken build
        run: python build/check_site.py

      - name: Commit what changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html kava-pairings.html
          git add build/history.json build/roster.json build/seeds.json
          if [ -d build/nights ]; then git add -A build/nights; fi   # gone once folded in
          for f in season-*.html; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Build the ladder"
          git pull --rebase origin main
          git push origin HEAD:main

      # a push made by this workflow's own token may not start a Pages build by
      # itself, so ask for one; harmless when Pages had already started
      - name: Ask Pages to publish
        continue-on-error: true
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
